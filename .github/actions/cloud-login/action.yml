name: cloud-login
description: Keyless (OIDC) login to AWS or GCP. This is the ONLY place where credentials differ per cloud.
inputs:
  cloud:             { description: "aws | gcp", required: true }
  region:            { description: "cloud region", required: true }
  aws_role_arn:      { description: "IAM role to assume (aws)", required: false, default: "" }
  gcp_wif_provider:  { description: "Workload Identity provider resource name (gcp)", required: false, default: "" }
  gcp_service_account: { description: "Service account email (gcp)", required: false, default: "" }
runs:
  using: composite
  steps:
    - if: inputs.cloud == 'aws'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.region }}
    - if: inputs.cloud == 'gcp'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.gcp_wif_provider }}
        service_account: ${{ inputs.gcp_service_account }}
    - if: inputs.cloud == 'gcp'
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: gke-gcloud-auth-plugin
