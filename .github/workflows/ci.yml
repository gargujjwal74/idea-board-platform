name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ideas, POSTGRES_PASSWORD: ideas, POSTGRES_DB: ideas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ideas" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ideas:ideas@localhost:5432/ideas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: app/backend/requirements-dev.txt }
      - run: pip install -r app/backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: app/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: app/frontend

  ai-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai/requirements-dev.txt }
      - run: pip install -r ai/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: ai

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render every cloud x profile combination
        run: |
          for cloud in local aws gcp; do
            helm lint charts/idea-board -f charts/idea-board/values/$cloud.yaml --set database.url=postgresql://u:p@h:5432/d
          done
          for profile in cost-sensitive high-availability; do
            helm template t charts/idea-board -f charts/idea-board/values/aws.yaml \
              -f charts/idea-board/values/profile-$profile.yaml --set database.url=postgresql://u:p@h:5432/d > /dev/null
          done

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra/envs/aws, infra/envs/gcp, infra/bootstrap/aws, infra/bootstrap/gcp]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.10" }
      - uses: terraform-linters/setup-tflint@v4
      - run: terraform fmt -check -recursive infra
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: ${{ matrix.dir }}
      - run: tflint --init && tflint --config "$GITHUB_WORKSPACE/infra/.tflint.hcl" --chdir "${{ matrix.dir }}"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IaC misconfiguration scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          skip-dirs: "**/.terraform"
          exit-code: "1"
      - name: Dependency + secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: "**/.terraform,**/node_modules"
          exit-code: "1"

  images:
    # Build once, deploy the same immutable image to every cloud (tag = commit SHA).
    needs: [backend, frontend, ai-tools, helm, terraform, security]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: meta
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR requires lowercase
          image="ghcr.io/${owner}/idea-board-${{ matrix.component }}"
          tags="${image}:sha-${sha::7}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then tags="${tags},${image}:latest"; fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "short=sha-${sha::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan pushed image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
