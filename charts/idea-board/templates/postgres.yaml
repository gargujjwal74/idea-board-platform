{{- if .Values.postgres.enabled }}
# Bundled Postgres for local/preview environments ONLY. Production uses the managed DB.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ib.fullname" . }}-postgres
  labels: {{- include "ib.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ib.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "ib.selector" (dict "component" "postgres" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ib.selector" (dict "component" "postgres" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: pg, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.db | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      {{- if not .Values.postgres.persistence }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgres.persistence }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ib.fullname" . }}-postgres
  labels: {{- include "ib.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "ib.selector" (dict "component" "postgres" "Release" .Release) | nindent 4 }}
  ports:
    - { name: pg, port: 5432 }
{{- end }}
