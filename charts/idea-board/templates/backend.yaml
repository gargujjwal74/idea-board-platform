apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ib.fullname" . }}-backend
  labels: {{- include "ib.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "ib.selector" (dict "component" "backend" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ib.selector" (dict "component" "backend" "Release" .Release) | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.image.backend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - secretRef:
                name: {{ include "ib.secretName" . }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- include "ib.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ib.fullname" . }}-backend
  labels: {{- include "ib.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ib.selector" (dict "component" "backend" "Release" .Release) | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
