services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ideas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideas}
      POSTGRES_DB: ${POSTGRES_DB:-ideas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./app/backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ideas}:${POSTGRES_PASSWORD:-ideas}@db:5432/${POSTGRES_DB:-ideas}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./app/frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  pgdata:
